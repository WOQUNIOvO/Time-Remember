server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: time-remember
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/time_remember?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: woai3hui
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 60MB

app:
  file-storage:
    upload-dir: D:/program/gitcode/my-time/Time-Remember/uploads
    max-file-size: 52428800
    allowed-content-types:
      - image/jpeg
      - image/png
      - image/gif
      - image/webp
      - video/mp4
      - video/webm
      - video/quicktime

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.timeremember.entity
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

jwt:
  secret: "time-remember-change-me-to-a-long-random-secret-key-2026"
  expiration-minutes: 1440

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    com.timeremember: info
